<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>IEEE IAS ENIG Student Branch Chapter</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- ============================================================
     FONTS: Barlow Condensed (industrial display) + IBM Plex Sans (body)
     Feel free to swap for other Google Fonts if desired.
============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>

<style>
/* ============================================================
   RESET & CSS VARIABLES
   — Green industrial palette replacing the original blue/gold
============================================================ */
*{margin:0;padding:0;box-sizing:border-box}

:root{
  /* Primary greens */
  --green:       #1a7a3c;   /* main brand green          */
  --green-dark:  #0d3d1e;   /* deep forest / backgrounds */
  --green-mid:   #2a9d54;   /* mid-tone accents          */
  --green-light: #3ec76e;   /* bright highlight          */

  /* Accent */
  --lime:        #b5e550;   /* sharp industrial lime     */
  --lime-dim:    #8ab83a;   /* muted lime for borders    */

  /* Neutrals */
  --white:       #ffffff;
  --off-white:   #f0f7f2;   /* very pale green-tinted bg */
  --text:        #0d1a10;   /* near-black with green tint*/
  --muted:       #4a6352;   /* muted green-grey          */

  /* Typography */
  --font-display: 'Barlow Condensed', sans-serif;
  --font-body:    'IBM Plex Sans', sans-serif;
}

html{scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--white);color:var(--text);overflow-x:hidden}

/* Scrollbar — thin, industrial feel */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--green-dark)}
::-webkit-scrollbar-thumb{background:var(--lime);border-radius:0}

/* ============================================================
   NAV
============================================================ */
nav{
  position:fixed;top:0;left:0;right:0;z-index:999;
  height:68px;display:flex;align-items:center;
  justify-content:space-between;padding:0 4vw;
  transition:background 0.3s,box-shadow 0.3s;
  border-bottom:1px solid transparent;
}
nav.scrolled{
  background:rgba(13,29,16,0.97);
  backdrop-filter:blur(14px);
  box-shadow:0 2px 28px rgba(0,0,0,0.4);
  border-bottom-color:rgba(181,229,80,0.15);
}
nav.top{background:transparent}

/* --- Logo area ---
   Contains two image slots + text fallback.
   Replace the <img> src attributes with your real logo files. */
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}

/* TODO: replace src with actual IEEE IAS logo file path */
.logo-img-ieee{
  height:48px;width:auto;
  display:flex;align-items:center;justify-content:center;
}
.logo-img-ieee img{height:48px;width:auto;display:block}
.logo-img-ieee .placeholder-label{
  color:var(--lime);font-size:9px;font-weight:600;
  letter-spacing:1.5px;padding:0 8px;text-align:center;line-height:1.3;
  font-family:var(--font-display);
}

/* TODO: replace src with actual ENIG / university logo file path */
.logo-img-enig{
  height:48px;width:auto;
  display:flex;align-items:center;justify-content:center;
}
.logo-img-enig img{height:48px;width:auto;display:block}
.logo-img-enig .placeholder-label{
  color:var(--lime);font-size:9px;font-weight:600;
  letter-spacing:1.5px;padding:0 8px;text-align:center;line-height:1.3;
  font-family:var(--font-display);
}

.logo-divider{width:1px;height:28px;background:rgba(255,255,255,0.2)}
.logo-text{
  color:var(--white);
  font-family:var(--font-display);
  font-weight:700;font-size:16px;letter-spacing:0.5px;
}

.nav-links{display:flex;gap:2.2rem;list-style:none}
.nav-links a{
  color:rgba(255,255,255,0.72);text-decoration:none;
  font-size:14px;font-weight:500;
  transition:color 0.2s;letter-spacing:0.5px;
  text-transform:uppercase;
}
.nav-links a:hover{color:var(--lime)}

/* ============================================================
   HERO
============================================================ */
.hero{
  min-height:100vh;
  background:var(--green-dark);
  position:relative;display:flex;align-items:center;
  justify-content:center;overflow:hidden;padding:80px 4vw 60px;
}

/* Tight industrial grid pattern */
.hero-bg-circuit{
  position:absolute;inset:0;opacity:0.07;
  background-image:
    linear-gradient(rgba(181,229,80,0.8) 1px,transparent 1px),
    linear-gradient(90deg,rgba(181,229,80,0.8) 1px,transparent 1px);
  background-size:48px 48px;
}

/* Subtle radial glow centered */
.hero-glow{
  position:absolute;width:720px;height:720px;border-radius:50%;
  background:radial-gradient(circle,rgba(26,122,60,0.4) 0%,transparent 70%);
  top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;
}

.hero-content{position:relative;z-index:2;text-align:center;max-width:840px}

.hero-eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  border:1px solid rgba(181,229,80,0.45);
  color:var(--lime);font-size:11px;font-weight:600;
  letter-spacing:3px;text-transform:uppercase;
  padding:7px 18px;border-radius:2px;margin-bottom:1.8rem;
  animation:fadeUp 0.7s ease both;
}
.hero-eyebrow::before{
  content:'';width:6px;height:6px;border-radius:50%;
  background:var(--lime);display:block;animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(1.5)}}

.hero h1{
  font-family:var(--font-display);font-weight:800;
  font-size:clamp(2.8rem,7vw,5.5rem);
  color:var(--white);line-height:1.0;
  margin-bottom:0.6rem;
  animation:fadeUp 0.8s 0.15s ease both;
  letter-spacing:1px;text-transform:uppercase;
}
.hero h1 em{color:var(--lime);font-style:normal}

.hero-tagline{
  font-size:clamp(0.95rem,1.8vw,1.12rem);
  color:rgba(255,255,255,0.62);line-height:1.8;
  max-width:560px;margin:0 auto 2.6rem;
  animation:fadeUp 0.8s 0.3s ease both;
}

.hero-stats{
  display:flex;justify-content:center;
  gap:clamp(1.5rem,5vw,5rem);flex-wrap:wrap;
  margin-bottom:2.8rem;animation:fadeUp 0.8s 0.45s ease both;
}
.hero-stat{text-align:center}
.stat-num{
  font-family:var(--font-display);
  font-size:clamp(2rem,5vw,3.4rem);
  font-weight:800;color:var(--lime);line-height:1;
  letter-spacing:1px;
}
.stat-divider{width:1px;height:55px;background:rgba(255,255,255,0.15);align-self:center}
.stat-label{font-size:12px;color:rgba(255,255,255,0.45);margin-top:6px;letter-spacing:1px;text-transform:uppercase}

.hero-cta{
  display:flex;gap:1rem;justify-content:center;
  flex-wrap:wrap;animation:fadeUp 0.8s 0.6s ease both;
}
.btn-primary{
  background:var(--lime);color:var(--green-dark);
  font-family:var(--font-display);font-weight:700;
  font-size:15px;letter-spacing:1px;text-transform:uppercase;
  padding:13px 34px;border-radius:2px;border:none;
  cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;
  text-decoration:none;display:inline-block;
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(181,229,80,0.35)}
.btn-outline{
  background:transparent;color:var(--white);
  font-family:var(--font-display);font-weight:600;
  font-size:15px;letter-spacing:1px;text-transform:uppercase;
  padding:12px 34px;border-radius:2px;
  border:1.5px solid rgba(255,255,255,0.3);
  cursor:pointer;transition:all 0.2s;
  text-decoration:none;display:inline-block;
}
.btn-outline:hover{border-color:var(--lime);color:var(--lime)}

.hero-scroll{
  position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  animation:fadeUp 1s 0.9s ease both;cursor:pointer;
}
.hero-scroll span{color:rgba(255,255,255,0.35);font-size:10px;letter-spacing:3px;text-transform:uppercase}
.scroll-line{
  width:1px;height:40px;
  background:linear-gradient(to bottom,rgba(181,229,80,0.8),transparent);
  animation:scrollAnim 1.8s ease-in-out infinite;
}
@keyframes scrollAnim{
  0%{transform:scaleY(0);transform-origin:top}
  50%{transform:scaleY(1);transform-origin:top}
  51%{transform:scaleY(1);transform-origin:bottom}
  100%{transform:scaleY(0);transform-origin:bottom}
}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}

/* ============================================================
   SHARED SECTION STYLES
============================================================ */
section{padding:100px 4vw}

.section-label{
  display:inline-block;font-size:10px;font-weight:600;
  letter-spacing:3.5px;text-transform:uppercase;
  color:var(--lime);margin-bottom:0.9rem;
  border-left:3px solid var(--lime);padding-left:10px;
  font-family:var(--font-display);
}
.section-title{
  font-family:var(--font-display);font-weight:800;
  font-size:clamp(2rem,4vw,3rem);color:var(--text);
  line-height:1.1;margin-bottom:1rem;
  text-transform:uppercase;letter-spacing:0.5px;
}
.section-title.light{color:var(--white)}
.section-sub{font-size:1rem;color:var(--muted);line-height:1.75;max-width:560px}
.section-sub.light{color:rgba(255,255,255,0.6)}

/* ============================================================
   ABOUT
============================================================ */
.about{background:var(--white)}
.about-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:5rem;align-items:center;max-width:1200px;margin:0 auto;
}
.about-image-block{position:relative}
.about-card{
  background:var(--green-dark);border-radius:4px;
  padding:2.5rem;color:var(--white);
  position:relative;overflow:hidden;
  border-left:4px solid var(--lime);
}
.about-card::after{
  content:'IAS';position:absolute;right:-10px;bottom:-30px;
  font-family:var(--font-display);font-size:9rem;font-weight:800;
  color:rgba(181,229,80,0.06);line-height:1;
  pointer-events:none;user-select:none;
}
.about-card-tag{
  background:var(--lime);color:var(--green-dark);
  font-family:var(--font-display);
  font-size:11px;font-weight:700;letter-spacing:2px;
  padding:4px 10px;border-radius:2px;
  display:inline-block;margin-bottom:1.2rem;text-transform:uppercase;
}
.about-card h3{
  font-family:var(--font-display);font-size:1.6rem;
  font-weight:800;margin-bottom:0.8rem;
  text-transform:uppercase;letter-spacing:0.5px;
}
.about-card p{font-size:0.92rem;color:rgba(255,255,255,0.65);line-height:1.8}
.about-features{margin-top:1.5rem;display:flex;flex-direction:column;gap:0.7rem}
.about-feat{display:flex;align-items:center;gap:10px;font-size:14px;color:rgba(255,255,255,0.8)}
.feat-dot{width:7px;height:7px;border-radius:0;background:var(--lime);flex-shrink:0;transform:rotate(45deg)}

.about-text h2{
  font-family:var(--font-display);font-weight:800;
  font-size:clamp(1.8rem,3.5vw,2.6rem);
  line-height:1.1;margin-bottom:1.2rem;
  text-transform:uppercase;
}
.about-text p{color:var(--muted);line-height:1.85;font-size:1rem;margin-bottom:1rem}
.pillars{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.5rem}
.pillar{
  background:var(--off-white);border-radius:2px;
  padding:1rem 1.2rem;border-left:3px solid var(--green);
}
.pillar h4{
  font-family:var(--font-display);font-size:14px;font-weight:700;
  color:var(--green-dark);margin-bottom:4px;
  text-transform:uppercase;letter-spacing:0.5px;
}
.pillar p{font-size:13px;color:var(--muted)}

/* ============================================================
   EVENTS
============================================================ */
.events{background:var(--green-dark);position:relative;overflow:hidden}
.events::before{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(181,229,80,0.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(181,229,80,0.04) 1px,transparent 1px);
  background-size:48px 48px;
}
.events-inner{max-width:1200px;margin:0 auto;position:relative;z-index:1}
.events-header{
  display:flex;justify-content:space-between;
  align-items:flex-end;margin-bottom:3rem;flex-wrap:wrap;gap:1rem;
}
.events-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.5rem}

.event-card{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:4px;overflow:hidden;
  transition:transform 0.3s,border-color 0.3s;cursor:default;
}
.event-card:hover{transform:translateY(-6px);border-color:rgba(181,229,80,0.4)}

/* --- Event card image area ---
   Replace the placeholder div with an <img> tag when you have event photos.
   Example:
     <img src="./images/events/ev-workshop.jpg"
          alt="Power Electronics Workshop"
          class="event-img" />
   Then set .event-img { width:100%; height:160px; object-fit:cover; } */
.event-card-top{
  background:linear-gradient(135deg,var(--green-dark),var(--green));
  padding:1.5rem;position:relative;overflow:hidden;
  min-height:130px;display:flex;flex-direction:column;justify-content:flex-end;
}
.event-card-bg{
  position:absolute;inset:0;opacity:0.12;
  font-family:var(--font-display);font-size:6rem;font-weight:800;
  color:var(--lime);display:flex;align-items:center;
  justify-content:center;line-height:1;
}

/* Placeholder shown when no event image is provided */
.event-img-placeholder{
  width:100%;height:160px;
  background:rgba(181,229,80,0.07);
  border-bottom:1px dashed rgba(181,229,80,0.2);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;letter-spacing:2px;
  color:rgba(181,229,80,0.4);text-transform:uppercase;
  font-family:var(--font-display);
}

.event-date{
  background:var(--lime);color:var(--green-dark);
  font-family:var(--font-display);font-weight:700;
  font-size:11px;letter-spacing:1.5px;
  padding:4px 10px;border-radius:2px;
  display:inline-block;position:relative;z-index:1;
  margin-bottom:0.5rem;text-transform:uppercase;
}
.event-title{
  font-family:var(--font-display);font-weight:700;
  font-size:1.05rem;color:var(--white);
  position:relative;z-index:1;letter-spacing:0.3px;
}
.event-body{padding:1.2rem 1.5rem}
.event-body p{font-size:14px;color:rgba(255,255,255,0.58);line-height:1.65}
.event-tag{
  display:inline-block;margin-top:0.8rem;
  font-size:10px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;color:var(--lime);
  border:1px solid rgba(181,229,80,0.3);
  padding:3px 10px;border-radius:2px;
  font-family:var(--font-display);
}

/* ============================================================
   TEAM
============================================================ */
.team{background:var(--off-white)}
.team-inner{max-width:1200px;margin:0 auto}
.team-header{text-align:center;margin-bottom:3.5rem}
.team-header .section-sub{margin:0 auto}
.team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1.8rem}

.member-card{
  background:var(--white);border-radius:4px;overflow:hidden;
  transition:transform 0.3s,box-shadow 0.3s;
  border:1px solid rgba(26,122,60,0.1);
  border-top:3px solid var(--green);
}
.member-card:hover{transform:translateY(-8px);box-shadow:0 20px 48px rgba(13,61,30,0.15)}

/* --- Member avatar / photo area ---
   Option A (current): initials placeholder styled block.
   Option B (with photos): replace the .member-avatar div content with:
     <img src="./images/team/member-name.jpg"
          alt="Member Name"
          class="member-photo" />
   Then add CSS: .member-photo { width:100%; height:160px; object-fit:cover; object-position:top; }
   And remove or hide .member-avatar's background/font styles. */
.member-avatar{
  height:160px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:2.6rem;font-weight:800;
  position:relative;overflow:hidden;
}

/* Dashed border hint when no photo — remove once real photos are used */
.member-avatar-placeholder{
  position:absolute;inset:8px;
  border:1px dashed rgba(181,229,80,0.25);border-radius:2px;
  pointer-events:none;
}

.member-info{padding:1.2rem}
.member-name{
  font-family:var(--font-display);font-weight:700;
  font-size:1.05rem;color:var(--text);margin-bottom:4px;
  text-transform:uppercase;letter-spacing:0.3px;
}
.member-role{font-size:13px;color:var(--muted)}
.member-role span{color:var(--green);font-weight:600}

/* ============================================================
   CONTACT
============================================================ */
.contact{background:var(--white)}
.contact-inner{
  max-width:1100px;margin:0 auto;
  display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:start;
}
.contact-info h2{
  font-family:var(--font-display);font-weight:800;
  font-size:clamp(1.8rem,3vw,2.6rem);
  margin-bottom:1rem;text-transform:uppercase;
}
.contact-info p{color:var(--muted);line-height:1.75;margin-bottom:2rem}
.contact-detail{display:flex;align-items:flex-start;gap:14px;margin-bottom:1.5rem}
.contact-icon{
  width:44px;height:44px;border-radius:2px;
  background:var(--green-dark);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.contact-icon svg{width:20px;height:20px;fill:var(--lime)}
.contact-detail-text label{
  display:block;font-size:10px;letter-spacing:2.5px;
  text-transform:uppercase;color:var(--muted);margin-bottom:4px;
  font-family:var(--font-display);font-weight:700;
}
.contact-detail-text a,.contact-detail-text p{
  font-size:15px;color:var(--text);text-decoration:none;
  font-weight:500;line-height:1.5;
}
.contact-detail-text a:hover{color:var(--green)}
.contact-form{
  background:var(--off-white);border-radius:4px;
  padding:2.5rem;border:1px solid rgba(26,122,60,0.1);
  border-top:3px solid var(--green);
}
.form-group{margin-bottom:1.2rem}
.form-group label{
  display:block;font-size:10px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px;
  font-family:var(--font-display);
}
.form-group input,.form-group textarea{
  width:100%;background:var(--white);
  border:1.5px solid rgba(26,122,60,0.15);
  border-radius:2px;padding:12px 16px;
  font-family:var(--font-body);font-size:15px;
  color:var(--text);outline:none;transition:border-color 0.2s;
}
.form-group input:focus,.form-group textarea:focus{border-color:var(--green)}
.form-group textarea{resize:vertical;min-height:120px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}

/* ============================================================
   FOOTER
============================================================ */
footer{background:var(--green-dark);padding:3rem 4vw 2rem}
.footer-inner{max-width:1200px;margin:0 auto}
.footer-top{
  display:flex;justify-content:space-between;align-items:center;
  padding-bottom:2rem;
  border-bottom:1px solid rgba(255,255,255,0.07);
  flex-wrap:wrap;gap:1.5rem;
}
.footer-logo{display:flex;flex-direction:column;gap:8px}

/* Footer logo images — same pattern as nav.
   Replace img src once assets are available. */
.footer-logo-imgs{display:flex;align-items:center;gap:10px}
.footer-logo-img{
  height:30px;width:auto;
  /* Placeholder styling — remove border/bg once real images are used */
  background:rgba(181,229,80,0.08);
  border:1px dashed rgba(181,229,80,0.25);
  border-radius:2px;min-width:50px;
  display:flex;align-items:center;justify-content:center;
}
.footer-logo-img img{height:28px;width:auto;display:block}
.footer-logo-img .placeholder-label{
  color:rgba(181,229,80,0.5);font-size:8px;font-weight:700;
  letter-spacing:1.5px;padding:0 6px;
  font-family:var(--font-display);
}

.footer-badge{
  background:var(--lime);color:var(--green-dark);
  font-family:var(--font-display);font-weight:800;
  font-size:11px;letter-spacing:2px;
  padding:4px 10px;border-radius:2px;
  width:fit-content;text-transform:uppercase;
}
.footer-logo p{color:rgba(255,255,255,0.4);font-size:13px;margin-top:4px}

.footer-links{display:flex;gap:2rem;flex-wrap:wrap}
.footer-links a{
  color:rgba(255,255,255,0.45);text-decoration:none;
  font-size:12px;transition:color 0.2s;cursor:pointer;
  text-transform:uppercase;letter-spacing:1px;
  font-family:var(--font-display);font-weight:600;
}
.footer-links a:hover{color:var(--lime)}

.footer-bottom{
  padding-top:1.5rem;display:flex;
  justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:1rem;
}
.footer-bottom p{color:rgba(255,255,255,0.25);font-size:12px;letter-spacing:0.3px}
.ieee-badge{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,0.35);font-size:12px}
.ieee-badge span{color:var(--lime);font-weight:700;font-family:var(--font-display)}

/* Address bar in footer */
.address-bar{

/* ============================================================
   COUNT-UP ANIMATION COMPONENT (unchanged logic)
============================================================ */
function CountUp({target, suffix='', duration=2000}) {
  const [count, setCount] = useState(0);
  const ref = useRef(null);
  const started = useRef(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting && !started.current) {
        started.current = true;
        let start = 0;
        const step = target / (duration / 16);
        const t = setInterval(() => {
          start = Math.min(start + step, target);
          setCount(Math.floor(start));
          if (start >= target) clearInterval(t);
        }, 16);
      }
    }, {threshold:0.5});
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, [target, duration]);
  return <span ref={ref}>{count}{suffix}</span>;
}
